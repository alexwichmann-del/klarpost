<svg xmlns="http://www.w3.org/2000/svg" width="920" height="248" viewBox="0 0 920 248" role="img" aria-labelledby="title desc">
  <title id="title">klarpost evaluation</title>
  <desc id="desc">Fixture messages are matched against YAML rules, an action is chosen by priority, a hard safety veto blocks delete-candidates on protected mail, and the result is a reviewable receipt with attention cost.</desc>
  <rect width="920" height="248" fill="#F7F4EF"/>
  <text x="28" y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#57534E" letter-spacing="0.08em">EVALUATION · DETERMINISTIC · FIXTURES ONLY</text>

  <!-- nodes -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="28" y="56" width="148" height="88" rx="6" fill="#FFFCF7" stroke="#1C1917" stroke-width="1.75"/>
    <text x="102" y="94" text-anchor="middle" font-size="15" font-weight="600" fill="#1C1917">Fixture</text>
    <text x="102" y="116" text-anchor="middle" font-size="11" fill="#57534E">synthetic JSON</text>

    <rect x="212" y="56" width="148" height="88" rx="6" fill="#FFFCF7" stroke="#1C1917" stroke-width="1.75"/>
    <text x="286" y="94" text-anchor="middle" font-size="15" font-weight="600" fill="#1C1917">Match</text>
    <text x="286" y="116" text-anchor="middle" font-size="11" fill="#57534E">YAML + keyword rails</text>

    <rect x="396" y="56" width="148" height="88" rx="6" fill="#FFFCF7" stroke="#1C1917" stroke-width="1.75"/>
    <text x="470" y="94" text-anchor="middle" font-size="15" font-weight="600" fill="#1C1917">Choose</text>
    <text x="470" y="116" text-anchor="middle" font-size="11" fill="#57534E">file &gt; archive &gt; keep</text>

    <rect x="580" y="56" width="148" height="88" rx="6" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.75"/>
    <text x="654" y="94" text-anchor="middle" font-size="15" font-weight="600" fill="#9A3412">Veto</text>
    <text x="654" y="116" text-anchor="middle" font-size="11" fill="#9A3412">never delete protected</text>

    <rect x="764" y="56" width="128" height="88" rx="6" fill="#0F766E" />
    <text x="828" y="94" text-anchor="middle" font-size="15" font-weight="600" fill="#F7F4EF">Receipt</text>
    <text x="828" y="116" text-anchor="middle" font-size="11" fill="#CCFBF1">id · action · cost · why</text>
  </g>

  <!-- arrows -->
  <g fill="#1C1917">
    <polygon points="184,100 204,100 204,96 212,104 204,112 204,108 184,108"/>
    <polygon points="368,100 388,100 388,96 396,104 388,112 388,108 368,108"/>
    <polygon points="552,100 572,100 572,96 580,104 572,112 572,108 552,108"/>
    <polygon points="736,100 756,100 756,96 764,104 756,112 756,108 736,108"/>
  </g>

  <!-- cost legend -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#44403C">
    <text x="28" y="182" font-weight="600" fill="#1C1917">Attention cost (lower is quieter)</text>
    <text x="28" y="206">file / archive = 1</text>
    <text x="188" y="206">delete_candidate = 2  ·  still needs a human</text>
    <text x="488" y="206">keep = 3  ·  still occupies the inbox</text>
    <text x="28" y="230" fill="#57534E">Protected mail cannot pay cost 2. A candidate is never execution.</text>
  </g>
</svg>
