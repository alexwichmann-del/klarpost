<svg xmlns="http://www.w3.org/2000/svg" width="560" height="268" viewBox="0 0 560 268" role="img" aria-labelledby="title desc">
  <title id="title">klarpost action ladder</title>
  <desc id="desc">Higher rungs win when several rules match. File beats archive beats keep beats a delete suggestion.</desc>
  <rect width="560" height="268" fill="#F7F4EF"/>
  <text x="24" y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#57534E" letter-spacing="0.08em">ACTION LADDER · HIGHER WINS</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="24" y="48" width="512" height="44" rx="4" fill="#0F766E"/>
    <text x="40" y="76" font-size="15" font-weight="600" fill="#F7F4EF">ablegen · file the paper trail</text>
    <text x="500" y="76" text-anchor="end" font-size="13" fill="#CCFBF1">cost 1</text>

    <rect x="24" y="100" width="512" height="44" rx="4" fill="#FFFCF7" stroke="#1C1917" stroke-width="1.5"/>
    <text x="40" y="128" font-size="15" font-weight="600" fill="#1C1917">archive · leave the inbox, keep the mail</text>
    <text x="500" y="128" text-anchor="end" font-size="13" fill="#57534E">cost 1</text>

    <rect x="24" y="152" width="512" height="44" rx="4" fill="#FFFCF7" stroke="#1C1917" stroke-width="1.5"/>
    <text x="40" y="180" font-size="15" font-weight="600" fill="#1C1917">keep · uncertainty stays visible</text>
    <text x="500" y="180" text-anchor="end" font-size="13" fill="#57534E">cost 3</text>

    <rect x="24" y="204" width="512" height="44" rx="4" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.5"/>
    <text x="40" y="232" font-size="15" font-weight="600" fill="#9A3412">delete_candidate · suggestion only</text>
    <text x="500" y="232" text-anchor="end" font-size="13" fill="#9A3412">cost 2</text>
  </g>
</svg>
