name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest
      - name: Validate sample packs
        run: |
          set -euo pipefail
          for pack in policies/packs/*.yaml; do
            klarpost validate --policy "$pack"
          done
      - name: Demo (fixtures only)
        run: python -m klarpost.demo -p policies/packs/inbox-calm.yaml -f fixtures/inbox_mixed.json
      - name: Protected fixtures must never be delete-candidates
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          packs = sorted(Path("policies/packs").glob("*.yaml"))
          fixtures = Path("fixtures/protected_must_keep.json")
          for pack in packs:
              proc = subprocess.run(
                  [
                      "klarpost",
                      "evaluate",
                      "--policy",
                      str(pack),
                      "--fixtures",
                      str(fixtures),
                      "--format",
                      "json",
                      "--fail-on-delete",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              rows = json.loads(proc.stdout)
              if not rows:
                  print(f"FAIL {pack}: empty evaluation", file=sys.stderr)
                  sys.exit(1)
              missing = [row["message_id"] for row in rows if "attention_cost" not in row]
              if missing:
                  print(f"FAIL {pack}: missing attention_cost on {missing}", file=sys.stderr)
                  sys.exit(1)
              print(f"ok   {pack}: {len(rows)} protected fixtures")
          PY
      - name: CLI refuses live-mail flags
        run: |
          set -euo pipefail
          if klarpost evaluate --imap mail.example --policy policies/packs/inbox-calm.yaml --fixtures fixtures/inbox_mixed.json; then
            echo "expected non-zero exit for --imap" >&2
            exit 1
          fi
