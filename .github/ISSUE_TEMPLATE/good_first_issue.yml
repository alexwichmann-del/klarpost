name: Good first issue
description: A small, scoped task for a new contributor
title: "good first issue: "
labels: ["good first issue"]
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: One evening or less. Point at files.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: pytest green; protected_must_keep.json has zero delete_candidate
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This task does not require a live mailbox
          required: true
        - label: This task does not weaken safety rails
          required: true
