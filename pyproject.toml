[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "klarpost"
version = "0.1.0"
description = "Policy-as-code for personal email hygiene. Protect receipts first; never auto-delete what matters."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Alexander Wichmann" },
]
keywords = [
  "email",
  "policy-as-code",
  "adhd",
  "inbox",
  "hygiene",
  "privacy",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Email",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.6,<3",
  "pyyaml>=6.0.1,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/alexwichmann-del/klarpost"
Repository = "https://github.com/alexwichmann-del/klarpost"
Issues = "https://github.com/alexwichmann-del/klarpost/issues"

[project.scripts]
klarpost = "klarpost.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/klarpost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
