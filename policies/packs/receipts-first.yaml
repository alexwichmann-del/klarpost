version: 1
id: receipts-first
name: Receipts first
description: >
  Conservative starter pack. File orders, invoices, tickets, banking, and
  security mail. Archive obvious newsletters. Do not propose deletes.
  Built for a high-sensory inbox: fewer decisions, visible paper trail.
locale: en
safety:
  never_delete_categories:
    - order
    - invoice
    - receipt
    - ticket
    - travel
    - banking
    - security
    - government
    - medical
    - legal
    - identity
  require_human_review_for_delete: true
  default_action: keep
rules:
  - id: ablegen-invoices
    priority: 90
    match:
      subject_contains:
        - invoice
        - receipt
        - rechnung
        - beleg
        - quittung
    classify: invoice
    action: ablegen
    reason: Invoices and receipts are paper trail — file them, never delete.

  - id: ablegen-orders
    priority: 85
    match:
      subject_contains:
        - order confirmation
        - your order
        - bestellbestätigung
        - shipping confirmation
        - tracking number
    classify: order
    action: ablegen
    reason: Order and shipping mail is a purchase record.

  - id: ablegen-tickets
    priority: 85
    match:
      subject_contains:
        - boarding pass
        - e-ticket
        - itinerary
        - reservation
        - buchungsbestätigung
        - fahrkarte
    classify: ticket
    action: ablegen
    reason: Tickets and bookings are time-sensitive and hard to replace.

  - id: ablegen-banking
    priority: 95
    match:
      subject_contains:
        - account statement
        - kontoauszug
        - sepa
        - lastschrift
        - payment received
        - überweisung
    classify: banking
    action: ablegen
    reason: Banking mail is a legal/financial record.

  - id: ablegen-security
    priority: 100
    match:
      subject_contains:
        - security alert
        - verification code
        - password reset
        - passwort zurücksetzen
        - new sign-in
        - 2fa
    classify: security
    action: ablegen
    reason: Security mail is never promotional noise.

  - id: ablegen-medical
    priority: 90
    match:
      subject_contains:
        - lab result
        - befund
        - prescription
        - appointment confirmation
        - terminbestätigung
    classify: medical
    action: ablegen
    reason: Medical mail is a health record — file it.

  - id: ablegen-identity
    priority: 95
    match:
      subject_contains: [passport, reisepass, personalausweis, national id]
    classify: identity
    action: ablegen
    reason: Identity documents are never promotional noise.

  - id: ablegen-government
    priority: 95
    match:
      subject_contains: [steuerbescheid, tax notice, tax assessment]
    classify: government
    action: ablegen
    reason: Government notices are records.

  - id: ablegen-legal
    priority: 95
    match:
      subject_contains: [court summons, legal notice, subpoena, vollmacht]
    classify: legal
    action: ablegen
    reason: Legal mail is filed, not cleaned up.

  - id: ablegen-travel
    priority: 85
    match:
      subject_contains: [hotel confirmation, hotel reservation, visa appointment]
    classify: travel
    action: ablegen
    reason: Travel confirmations are time-sensitive records.

  - id: archive-newsletters
    priority: 20
    match:
      has_list_unsubscribe: true
    classify: newsletter
    action: archive
    reason: List-Unsubscribe usually means a newsletter you can leave the inbox.
